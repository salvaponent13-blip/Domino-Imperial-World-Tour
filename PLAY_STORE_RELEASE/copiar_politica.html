<head>

<style>

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  .botones { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  button {
    background: #ffd700; color: #14202e; border: 0; border-radius: 10px;
    padding: 14px 20px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  button.sec { background: #223044; color: #ffd700; box-shadow: inset 0 0 0 2px #ffd700; }
  button:active { transform: translateY(1px); }
  #estado { min-height: 22px; color: #6ee7a8; font-weight: 700; margin-bottom: 16px; }

  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Copiar la política de privacidad</h1>
  <p class="hint">Pulsa un botón y pega en tu Google Sites con Ctrl+V.</p>

  <div class="botones">
    <button onclick="copiar('es', this)">Copiar solo español</button>
    <button class="sec" onclick="copiar('ambos', this)">Copiar español + inglés</button>
    <button class="sec" onclick="copiar('en', this)">Copiar solo inglés</button>
  </div>

  <div id="estado"></div>

  <details>
    <summary>Ver el texto (por si prefieres seleccionarlo a mano)</summary>
    <pre id="vista"></pre>
  </details>
</div>

<script type="text/plain" id="txt-es">
Política de Privacidad — Dominó Grand Prix

Última actualización: 27 de octubre de 2026
Aplicación: Dominó Grand Prix (com.horts.dominoimperial)
Desarrollador: Horts Studio


1. RESUMEN

Dominó Grand Prix es un juego de salón diseñado para ofrecer una experiencia auténtica de dominó tradicional. El juego almacena tu progreso exclusivamente en tu dispositivo móvil. Para ofrecer el juego de forma gratuita y con una compra opcional para quitar los anuncios, se integran anuncios no invasivos mediante la red publicitaria oficial Google AdMob.


2. QUÉ DATOS RECOGEMOS NOSOTROS

Nosotros no recogemos datos personales. En concreto:

• No solicitamos nombre, correo electrónico, teléfono ni información personal alguna.
• No creamos cuentas, perfiles de usuario ni registros externos.
• No tenemos servidores propios ni almacenamos partidas en la nube.
• No accedemos a tu agenda, cámara, micrófono, archivos personales ni ubicación física.


3. SERVICIOS DE TERCEROS Y PUBLICIDAD (GOOGLE ADMOB)

Para financiar el desarrollo y mantener el juego totalmente gratuito, Dominó Grand Prix utiliza el servicio de publicidad Google AdMob (Google LLC):

• Identificador de publicidad de Android (AD_ID): El SDK de Google Mobile Ads puede recopilar de forma automática el ID de publicidad del dispositivo, dirección IP e identificadores técnicos para mostrar anuncios, limitar la frecuencia de repetición y prevenir el tráfico no válido.
• Diagnóstico y rendimiento: Google AdMob recopila datos técnicos sobre interacciones y tiempos de respuesta de los anuncios para asegurar la estabilidad técnica.
• Compras dentro de la aplicación: existe una única compra opcional para quitar los anuncios (remove_ads), procesada íntegramente por Google Play. No hay monedas virtuales, suscripciones ni micropagos recurrentes.
• Políticas de Google: Puedes consultar cómo Google gestiona la información en https://policies.google.com/privacy y en https://policies.google.com/technologies/ads


4. PERMISOS DEL DISPOSITIVO

La aplicación únicamente requiere los permisos esenciales para el funcionamiento de los anuncios:

• Acceso a Internet (INTERNET, ACCESS_NETWORK_STATE): Necesario para cargar los anuncios de Google AdMob.
• Identificador de publicidad (com.google.android.gms.permission.AD_ID): Permiso estándar de Android para que Google Play Services gestione el identificador publicitario.
• Respuesta háptica: La vibración de las fichas utiliza la función háptica estándar del sistema y no recopila ningún tipo de dato.


5. QUÉ SE GUARDA EN TU TELÉFONO

Para que puedas continuar tu partida y conservar tus logros, el juego guarda localmente en el almacenamiento privado de la aplicación:

• El avance de la gira mundial (sedes y retos completados).
• Los logros desbloqueados y estadísticas de juego.
• Tus ajustes personalizados (idioma, efectos sonoros, velocidad de la IA).
• La partida activa, para que puedas reanudarla en cualquier momento.

Estos datos nunca salen de tu dispositivo y se eliminan automáticamente si decides desinstalar la aplicación.


6. CONTROL DEL USUARIO

Puedes restablecer o inhabilitar la personalización de tu identificador de publicidad en cualquier momento desde tu teléfono en:
Ajustes de Android > Privacidad > Anuncios.


7. CONTACTO

Si tienes cualquier duda sobre esta política de privacidad, puedes contactar con nosotros a través de la ficha de la aplicación en Google Play Store.
Email de soporte: hortsstudio@gmail.com
</script>

<script type="text/plain" id="txt-en">
Privacy Policy — Domino Grand Prix

Last updated: 24 October 2026
App: Domino Grand Prix (com.horts.dominoimperial)
Developer: Horts Studio


1. SUMMARY

Domino Grand Prix is a parlour domino game that stores your progress locally on your device. To keep the game completely free without in-app purchases, it displays non-intrusive ads powered by Google AdMob.


2. WHAT DATA WE COLLECT

None. We do not ask for personal details, email or account registration. We do not operate external servers, and we do not access personal files, camera, contacts or GPS location.


3. ADVERTISING AND THIRD-PARTY SERVICES (GOOGLE ADMOB)

Google Mobile Ads SDK may collect Android Advertising ID (AD_ID), device identifiers, IP address and diagnostic metrics for ad serving, frequency capping and fraud prevention. For more details, visit:
https://policies.google.com/privacy
https://policies.google.com/technologies/ads


4. DEVICE PERMISSIONS

INTERNET, ACCESS_NETWORK_STATE and AD_ID strictly for Google AdMob advertising operations.


5. LOCAL STORAGE

Game progress, tour challenges, achievements and audio settings are kept in the app's local sandbox and are erased upon uninstall.


6. USER CONTROLS

You can reset or opt out of personalized ads at any time in Android Settings > Privacy > Ads.


7. CONTACT

Email: hortsstudio@gmail.com
You can also use the support section of the official Google Play listing.
</script>

<script>
  const es = document.getElementById('txt-es').textContent.trim();
  const en = document.getElementById('txt-en').textContent.trim();
  const textos = { es: es, en: en, ambos: es + "\n\n\n" + "-".repeat(60) + "\n\n" + en };

  document.getElementById('vista').textContent = textos.es;

  function copiar(cual, btn) {
    const texto = textos[cual];
    const ok = () => {
      document.getElementById('estado').textContent = '✓ Copiado (' + texto.length.toLocaleString('es-ES') + ' caracteres). Pega con Ctrl+V.';
      btn.textContent = '✓ Copiado';
      setTimeout(() => { btn.textContent = texto === textos.es ? 'Copiar solo español' : (texto === textos.en ? 'Copiar solo inglés' : 'Copiar español + inglés'); }, 1800);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(ok).catch(() => copiarManual(texto, ok));
    } else {
      copiarManual(texto, ok);
    }
  }

  function copiarManual(texto, ok) {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy') ? ok() : (document.getElementById('estado').textContent = 'Selecciona el texto y pulsa Ctrl+C.');
    } catch (e) {
      document.getElementById('estado').textContent = 'Selecciona el texto y pulsa Ctrl+C.';
    }
    document.body.removeChild(ta);
  }
</script>
</body>
</html>
